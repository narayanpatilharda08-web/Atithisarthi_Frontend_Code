<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
<meta name="app-backend-base-url" content="https://atithisarthibackendcode-production.up.railway.app" />
<meta name="app-api-base-url" content="https://atithisarthibackendcode-production.up.railway.app/api" />
  <title>Kitchen Display</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3ed;
      color: #30251f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(201, 152, 79, 0.2), transparent 30rem),
        #f7f3ed;
    }

    .kds-redirect-card {
      width: min(460px, 100%);
      padding: clamp(24px, 7vw, 40px);
      border: 1px solid rgba(133, 86, 49, 0.16);
      border-radius: 24px;
      background: rgba(255, 253, 249, 0.96);
      box-shadow: 0 22px 60px rgba(66, 45, 32, 0.12);
      text-align: center;
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 7vw, 2.25rem);
    }

    p {
      margin: 0;
      color: #75685e;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      margin-top: 18px;
      padding: 10px 16px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #75475a;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #c9984f;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="kds-redirect-card" role="status" aria-live="polite">
    <h1>Opening kitchen display</h1>
    <p>You are being moved to the hotel-scoped live kitchen board.</p>
    <a id="kdsFallbackLink" href="./staff-orders.html?mode=kds-display">Open Kitchen Display</a>
  </main>
  <script>
    (function redirectToKitchenDisplay() {
      const params = new URLSearchParams(window.location.search);
      params.set("mode", "kds-display");
      const target = `./staff-orders.html?${params.toString()}`;
      const fallbackLink = document.getElementById("kdsFallbackLink");
      if (fallbackLink) fallbackLink.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
